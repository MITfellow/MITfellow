<svg xmlns="http://www.w3.org/2000/svg" width="720" height="460" viewBox="0 0 720 460" role="img" aria-label="Research map: intelligence at center, connected to AI agents, systems, science, and the physical world.">
  <rect width="720" height="460" fill="#ffffff"/>
  <g font-family="Menlo, Consolas, monospace" font-size="14" letter-spacing="3">
    <g stroke="#111111" stroke-width="1" opacity="0.8">
      <line x1="360" y1="96" x2="360" y2="150"/>
      <line x1="360" y1="150" x2="150" y2="230"/>
      <line x1="360" y1="150" x2="360" y2="230"/>
      <line x1="360" y1="150" x2="570" y2="230"/>
      <line x1="150" y1="270" x2="150" y2="320"/>
      <line x1="360" y1="270" x2="360" y2="320"/>
      <line x1="570" y1="270" x2="570" y2="320"/>
      <line x1="150" y1="320" x2="360" y2="392"/>
      <line x1="570" y1="320" x2="360" y2="392"/>
    </g>
    <g fill="#ffffff" stroke="#111111" stroke-width="1.5">
      <rect x="252" y="56" width="216" height="44" rx="2"/>
      <rect x="70" y="230" width="160" height="40" rx="2"/>
      <rect x="280" y="230" width="160" height="40" rx="2"/>
      <rect x="490" y="230" width="160" height="40" rx="2"/>
      <rect x="248" y="372" width="224" height="44" rx="2"/>
    </g>
    <g fill="#111111" text-anchor="middle">
      <text x="360" y="83">INTELLIGENCE</text>
      <text x="150" y="255">AI / AGENTS</text>
      <text x="360" y="255">SYSTEMS</text>
      <text x="570" y="255">SCIENCE</text>
      <text x="360" y="399">PHYSICAL WORLD</text>
    </g>
    <g fill="#666666" font-size="11" text-anchor="middle" letter-spacing="2">
      <text x="150" y="292">experiment</text>
      <text x="360" y="292">build</text>
      <text x="570" y="292">measure</text>
    </g>
  </g>
</svg>
